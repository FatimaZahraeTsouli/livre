<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset ="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0" >
    <meta name="desciption" content="a completer">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>gestion de livres</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="bg-slate-700 text-white h-30 flex align-middle">
        <div class="flex items-center gap-4">
            <div>
                <img class="w-25 h-20 bg-slate-700" src="assets/images/logo_transparent.png" alt="logo de livres">
            </div>
            <div>
                <h1 class="font-bold text-3xl">Ma bibliothèque</h1>
                <h1 class="font-semibold text-xl">Mes Livres, Mes Histoires</h1>
            </div>
        </div>
    </header>

    <main>
        <section>
            <form>
                <div>
                    <h2>Ajouter un livre</h2>
                </div>
                <label for="title">Titre</label>
                <input type="text" id="title" placeholder="Ex: Hamelet" required>
                <label for="date">Année de publication</label>
                <input type="date" id="date" required>
                

            </form>
        </section>
    </main>






 



















</body>
</html>
